[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandr"
version = "2.0.0"
description = "Point & Resolve: graphical deterministic contact-signal language runtime"
requires-python = ">=3.11"
dependencies = ["sympy==1.14.0", "mpmath==1.3.0", "Pillow==12.2.0", "fastjsonschema==2.21.2"]

[project.scripts]
pandr = "pandr.__main__:main"

[tool.setuptools]
packages = ["pandr"]
